<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b6af6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle inner shine -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>
  <rect width="32" height="16" rx="7.5" fill="url(#sh)"/>

  <!-- Geometric S shape from rounded bars -->
  <!-- top bar -->
  <rect x="9" y="7.5" width="14" height="3" rx="1.5" fill="white"/>
  <!-- top-left leg -->
  <rect x="9" y="7.5" width="3" height="8.5" rx="1.5" fill="white"/>
  <!-- middle bar -->
  <rect x="9" y="14.5" width="14" height="3" rx="1.5" fill="white"/>
  <!-- bottom-right leg -->
  <rect x="20" y="14.5" width="3" height="8.5" rx="1.5" fill="white"/>
  <!-- bottom bar -->
  <rect x="9" y="21.5" width="14" height="3" rx="1.5" fill="white"/>
</svg>
